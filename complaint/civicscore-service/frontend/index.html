<!DOCTYPE html>
<html>
<head>
    <title>Civic Score Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Community Civic Portal</h1>
    <h2>My Civic Score</h2>
    <label>Citizen ID</label>
    <input type="number" id="citizenId" placeholder="Enter your Citizen ID">
    <button onclick="checkScore()">Check My Score</button>
    <div id="scoreResult"></div>
    <hr>
    <h2>Leaderboard</h2>
    <button onclick="loadLeaderboard()">Refresh Leaderboard</button>
    <div id="leaderboardResult"></div>
</div>
<script src="script.js"></script>
</body>
</html>
